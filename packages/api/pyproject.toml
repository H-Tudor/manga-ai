[project]
name = "manga-ai-api"
version = "0.1.0"
description = "FastAPI service for Manga AI"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "manga-dex",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
]

[tool.uv.sources]
manga-dex = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
